@keyframes in-twinkle {

  45% { opacity: 1; transform: scale(1); }
  60% { opacity: 0.85; transform: scale(0.9); }
}

  10% { background: rgba(96, 165, 250, 0.16); }
  22%, 100% { background: transparent; }
}

  0%, 8% { opacity: 0.25; }
  14%, 100% { opacity: 1; }
}

  0%, 40% { opacity: 0.25; }
  48%, 100% { opacity: 1; }
}
@keyframes in-born { 
  0%, 22% { opacity: 0; transform: scale(0.2); }
  30% { opacity: 1; transform: scale(1.25); }

  96%, 100% { opacity: 0; transform: scale(1); }

  24% { stroke-dashoffset: 0; }
  88% { stroke-dashoffset: 0; opacity: 1; }
  96%, 100% { opacity: 0; }
}
@keyframes in-pulse { 
  0%, 28% { opacity: 0; transform: scale(0.6); }
  32% { opacity: 0.8; }
  60%, 100% { opacity: 0; transform: scale(3); }
}
@keyframes in-note { 
  0%, 30% { opacity: 0; }
  38%, 86% { opacity: 1; }

}
@keyframes in-spark { 
  0% { opacity: 0; transform: scale(0.7); }

  30%, 100% { opacity: 0; transform: scale(1.4); }
}
@keyframes pulse {

}
@keyframes spin { 
  100% { transform: rotate(360deg); }
}
@keyframes sm-pulse {

}

 class=\"is-on\"><i><\/i><b>01<\/b>Two workflows<\/button><button type=\"button\"><i><\/i><b>02<\/b>Every door<\/button><button type=\"button\"><i><\/i><b>03<\/b>The apps around it<\/button><button type=\"button\"><i><\/i><b>04<\/b>The whole company<\/button><\/nav><div class=\"in-capstack\"><article class=\"in-cap is-on\" style=\"--i: 0;\"><div class=\"in-cap-n\">01 · Two workflows<\/div><h3>Workflows hand work to workflows.<\/h3><p>When a product brief is approved, the job opens itself in Sample &amp; production with its product manager and followers. Fields match by code, dropdowns by their label, and anything that does not fit is logged, not lost.<\/p><ul><li>Fields by code and label<\/li><li>Keep the assignee or reassign<\/li><li>Linked both ways<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 1;\"><div class=\"in-cap-n\">02 · Every door<\/div><h3>Every way in, every signal out.<\/h3><p>Automations, forms, spreadsheets, schedules, AI assistants and any system that can POST open jobs through the same first stage. Every move sends a signed event, retried until it lands.<\/p><ul><li>6 lối vào<\/li><li>16 events, signed<\/li><li>Retried and logged<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 2;\"><div class=\"in-cap-n\">03 · The apps around it<\/div><h3>A stage can be another app.<\/h3><p>The launch plan opens a project and waits for it. The supplier contract waits for eSign. Automations wait on a stage, and agents move jobs through MCP with the same permissions as your team.<\/p><ul><li>Project · eSign · Docs · Request<\/li><li>Automation waits on stages<\/li><li>Agents through MCP<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 3;\"><div class=\"in-cap-n\">04 · The whole company<\/div><h3>Zoom out, and it is one system that keeps growing.<\/h3><p>Every department’s workflows, the Rework apps between them and the tools outside, joined by the same jobs. When the company needs a new process, an automation can build it.<\/p><ul><li>Every department<\/li><li>Every Rework app<\/li><li>Anything with an API<\/li><\/ul><\/article><\/div><\/div><div class=\"in-stage\" aria-hidden=\"true\"><div class=\"in-world\" style=\"--z: 0.9644;\"><div class=\"in-lv\" style=\"--i: 0; transform: translate(0px, 0px) scale(1); opacity: 1; visibility: visible; --mini: 1.000; will-change: auto;\"><div class=\"in-abs in-top\"><span class=\"in-pill\"><b>Mô tả sản phẩm<\/b><span class=\"in-arw\">→<\/span><b>Mẫu và sản xuất<\/b>tự chuyển khi bản mô tả được duyệt<\/span><\/div><div class=\"in-pc\" style=\"left: 20px; top: 110px; width: 270px; height: 390px;\"><div class=\"in-bdh\"><img src=\"https://static-ai.stdfiles.com/fav/workflow?color=1ABC9C%2C3498DB%2C2980B9&amp;angle=225\" width=\"18\" height=\"18\" alt=\"\" loading=\"lazy\" decoding=\"async\" class=\"in-lg\" style=\"width: 18px; height: 18px; flex-shrink: 0; display: block;\">Mô tả sản phẩm<small>14 hồ sơ<\/small><\/div><div class=\"in-cols\"><div class=\"in-col\"><span>Nháp<\/span><i class=\"in-kc\">Ấm đun Nova<small>PB-0034<\/small><\/i><i class=\"in-kc\">Đèn bàn Lumi<small>PB-0033<\/small><\/i><i class=\"in-kc\">Quạt Terra<small>PB-0032<\/small><\/i><\/div><div class=\"in-col\"><span>Duyệt<\/span><i class=\"in-kc\">Máy xay mini<small>PB-0029<\/small><\/i><i class=\"in-kc\">Loa Arc<small>PB-0028<\/small><\/i><\/div><div class=\"in-col\"><span>Đã duyệt<\/span><i class=\"in-kc is-hot\">Máy lọc khí Aero 2<small>PB-0031<\/small><\/i><i class=\"in-kc\">Máy sưởi Halo<small>PB-0026<\/small><\/i><\/div><\/div><\/div><div class=\"in-pc\" style=\"left: 318px; top: 110px; width: 264px; height: 390px;\"><div class=\"in-fwh\">Luật chuyển tiếp<span>khi được duyệt<\/span><\/div><div class=\"in-fwchips\"><span>giữ <b>quản lý sản phẩm<\/b><\/span><span>mang theo <b>người theo dõi<\/b><\/span><span>tiền tố <b>[Chuyển]<\/b><\/span><\/div><div class=\"in-fwm\"><span>Trường được chuyển<\/span><span>5/6<\/span><\/div><div class=\"in-fx\" style=\"--d: 0s;\"><div><b>Tên sản phẩ \"--i: 0;\"><div class=\"in-cap-n\">01 · Two workflows<\/div><h3>Workflows hand work to workflows.<\/h3><p>When a product brief is approved, the job opens itself in Sample &amp; production with its product manager and followers. Fields match by code, dropdowns by their label, and anything that does not fit is logged, not lost.<\/p><ul><li>Fields by code and label<\/li><li>Keep the assignee or reassign<\/li><li>Linked both ways<\/li><\/ul><\/article><article class=\"in-cap is-on\" style=\"--i: 1;\"><div class=\"in-cap-n\">02 · Every door<\/div><h3>Every way in, every signal out.<\/h3><p>Automations, forms, spreadsheets, schedules, AI assistants and any system that can POST open jobs through the same first stage. Every move sends a signed event, retried until it lands.<\/p><ul><li>6 lối vào<\/li><li>16 events, signed<\/li><li>Retried and logged<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 2;\"><div class=\"in-cap-n\">03 · The apps around it<\/div><h3>A stage can be another app.<\/h3><p>The launch plan opens a project and waits for it. The supplier contract waits for eSign. Automations wait on a stage, and agents move jobs through MCP with the same permissions as your team.<\/p><ul><li>Project · eSign · Docs · Request<\/li><li>Automation waits on stages<\/li><li>Agents through MCP<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 3;\"><div class=\"in-cap-n\">04 · The whole company<\/div><h3>Zoom out, and it is one system that keeps growing.<\/h3><p>Every department’s workflows, the Rework apps between them and the tools outside, joined by the same jobs. When the company needs a new process, an automation can build it.<\/p><ul><li>Every department<\/li><li>Every Rework app<\/li><li>Anything with an API<\/li><\/ul><\/article><\/div><\/div><div class=\"in-stage\" aria-hidden=\"true\"><div class=\"in-world\" style=\"--z: 0.9644;\"><div class=\"in-lv\" style=\"--i: 0; transform: translate(0px, 0px) scale(0.3125); opacity: 0; visibility: hidden; -- fit is logged, not lost.<\/p><ul><li>Fields by code and label<\/li><li>Keep the assignee or reassign<\/li><li>Linked both ways<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 1;\"><div class=\"in-cap-n\">02 · Every door<\/div><h3>Every way in, every signal out.<\/h3><p>Automations, forms, spreadsheets, schedules, AI assistants and any system that can POST open jobs through the same first stage. Every move sends a signed event, retried until it lands.<\/p><ul><li>6 lối vào<\/li><li>16 events, signed<\/li><li>Retried and logged<\/li><\/ul><\/article><article class=\"in-cap is-on\" style=\"--i: 2;\"><div class=\"in-cap-n\">03 · The apps around it<\/div><h3>A stage can be another app.<\/h3><p>The launch plan opens a project and waits for it. The supplier contract waits for eSign. Automations wait on a stage, and agents move jobs through MCP with the same permissions as your team.<\/p><ul><li>Project · eSign · Docs · Request<\/li><li>Automation waits on stages<\/li><li>Agents through MCP<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 3;\"><div class=\"in-cap-n\">04 · The whole company<\/div><h3>Zoom out, and it is one system that keeps growing.<\/h3><p>Every department’s workflows, the Rework apps between them and the tools outside, joined by the same jobs. When the company needs a new process, an automation can build it.<\/p><ul><li>Every department<\/li><li>Every Rework app<\/li><li>Anything with an API<\/li><\/ul><\/article><\/div><\/div><div class=\"in-stage\" aria-hidden=\"true\"><div class=\"in-world\" style=\"--z: 0.9644;\"><div class=\"in-lv\" style=\"--i: 0; transform: translate(0px, 0px) scale(1); opacity: 0; visibility: hidden; --mini: 1.000; will-change: auto;\"><div class=\"in-abs in-top\"><span class=\"in-pill\"><b>Mô tả sản phẩm<\/b><span class=\"in-arw\">→<\/span><b>Mẫu và sản xuất<\/b>tự chuyển khi bản mô tả được duyệt<\/span><\/div><div class=\"in-pc\" style=\"left: 20px; top: 110px; width: 270px; height: 390px;\"><div class=\ omations, forms, spreadsheets, schedules, AI assistants and any system that can POST open jobs through the same first stage. Every move sends a signed event, retried until it lands.<\/p><ul><li>6 lối vào<\/li><li>16 events, signed<\/li><li>Retried and logged<\/li><\/ul><\/article><article class=\"in-cap\" style=\"--i: 2;\"><div class=\"in-cap-n\">03 · The apps around it<\/div><h3>A stage can be another app.<\/h3><p>The launch plan opens a project and waits for it. The supplier contract waits for eSign. Automations wait on a stage, and agents move jobs through MCP with the same permissions as your team.<\/p><ul><li>Project · eSign · Docs · Request<\/li><li>Automation waits on stages<\/li><li>Agents through MCP<\/li><\/ul><\/article><article class=\"in-cap is-on\" style=\"--i: 3;\"><div class=\"in-cap-n\">04 · The whole company<\/div><h3>Zoom out, and it is one system that keeps growing.<\/h3><p>Every department’s workflows, the Rework apps between them and the tools outside, joined by the same jobs. When the company needs a new process, an automation can build it.<\/p><ul><li>Every department<\/li><li>Every Rework app<\/li><li>Anything with an API<\/li><\/ul><\/article><\/div><\/div><div class=\"in-stage\" aria-hidden=\"true\"><div class=\"in-world\" style=\"--z: 0.9644;\"><div class=\"in-lv\" style=\"--i: 0; transform: translate(0px, 0px) scale(1); opacity: 0; visibility: hidden; --mini: 1.000; will-change: auto;\"><div class=\"in-abs in-top\"><span class=\"in-pill\"><b>Mô tả sản phẩm<\/b><span class=\"in-arw\">→<\/span><b>Mẫu và sản xuất<\/b>tự chuyển khi bản mô tả được duyệt<\/span><\/div><div class=\"in-pc\" style=\"left: 20px; top: 110px; width: 270px; height: 390px;\"><div class=\"in-bdh\"><img src=\"https://static-ai.stdfiles.com/fav/workflow?color=1ABC9C%2C3498DB%2C2980B9&amp;angle=225\" width=\"18\" height=\"18\" alt=\"\" loading=\"lazy\" decoding=\"async\" class=\"in-lg\" style=\"width: 18px; height: 18px; flex-shrink: 0; display: block;\">Mô tả sản phẩm<sm
