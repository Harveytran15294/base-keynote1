const PPL={'rgb(249, 168, 212)':['Giao Nguyễn','a7'],'rgb(196, 181, 253)':['Giang Đỗ','a6'],'rgb(253, 186, 116)':['Hà Nguyễn','a4'],'rgb(253, 164, 175)':['Hà Nguyễn','a4'],'rgb(252, 211, 77)':['Đức Phạm','a1'],'rgb(216, 180, 254)':['Quân Hoàng','a8'],'rgb(45, 212, 191)':['Bình Trần','a2']};

function patchPeople(html){

  html=html.replace(/<span class="ag-av" style="width: ([\d.]+)px; height: ([\d.]+)px; background: linear-gradient\(135deg, (rgb\([^)]*\)) 0%[^"]*">(\S)<\/span>/g,(m,w,h,c0)=>{const P=PPL[c0];if(!P)return m;return '<span class="ag-av" style="width:'+w+'px;height:'+h+'px;padding:0;overflow:hidden;background:#F3EFE6;"><img src="assets/avatars/'+P[1]+'.svg" alt="'+P[0]+'" style="width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;"></span>';});
  html=html.replace(/<b>(Giao|Giang|Hà|Đức|Quân|Bình|Khánh|Dũng|Trang)<\/b>/g,(m,n)=>'<b>'+FULL[n]+'</b>');
  html=html.replace(/(<\/span>)(Giao|Giang|Hà|Đức|Quân|Bình|Khánh|Dũng|Trang)(<\/button>)/g,(m,a,n,b)=>a+FULL[n]+b);
  return html;
}

const tpl=document.createElement('template');

function Player(key,box,cfg){const M=MOCKS[key];this.M=M;const fit=document.createElement('div');fit.className='fit';box.appendChild(fit);let host=fit;for(const c of M.chain){const e=mk(c.tag,c.attrs);if(cfg.rootW)e.style.setProperty('width',cfg.rootW+'px','important');host.appendChild(e);host=e}this.host=host;this.fit=fit;this.cfg=cfg;this.box=box;this.key=key;this.reset();}

const Q=new URLSearchParams(location.search);const FIT=Q.get('fit')||'contain';document.getElementById('box').style.visibility='hidden';const AY=Q.get('align')==='top'?0:Q.get('align')==='bottom'?1:.5;
Player.prototype.layout=function(){const w=this.root.offsetWidth,h=this.root.offsetHeight;if(!w||!h)return;const s=FIT==='width'?this.box.clientWidth/w:FIT==='cover'?Math.max(this.box.clientWidth/w,this.box.clientHeight/h):Math.min(this.box.clientWidth/w,this.box.clientHeight/h);this.box.style.visibility='visible';this.fit.style.transform='scale('+s+')';this.fit.style.left=(FIT==='height'?0:(this.box.clientWidth-w*s)/2)+'px';this.fit.style.top=((this.box.clientHeight-h*s)*AY)+'px';};
function setAttrs(el,a){for(const at of [...el.attributes]){if(!(at.name in a))el.removeAttribute(at.name)}for(const k in a){if(el.getAttribute(k)!==a[k])el.setAttribute(k,a[k])}}
Player.prototype.apply=function(ops){for(const o of ops){let n=this.root;for(const i of o.p){n=n&&n.children[i]}if(!n)continue;if(o.p.length===0&&this.key==='steps')o.a={...o.a,class:(o.a.class||'')+' mk-root-steps'};setAttrs(n,o.a);if(o.h!==undefined)n.innerHTML=o.h;}};
Player.prototype.tick=function(now){if(this.t0==null)this.t0=now;const M=this.M,el=(now-this.t0);if(el>=M.dur){this.t0=now;this.reset();this.layout();return}while(this.i<M.frames.length&&M.frames[this.i][0]<=el){this.apply(M.frames[this.i][1]);this.i++}};
